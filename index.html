<!DOCTYPE html>
<html lang="en" data-root="./" data-page="home">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>freechains</title>
  <meta name="description" content="freechains — projects, notes and a self-study journey to the Higgs boson.">
  <meta name="theme-color" content="#05060d">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/vendor/katex.min.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="orbit" aria-hidden="true"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div></div>
      <div class="eyebrow">// transmission from the lab</div>
      <h1>freechains</h1>
      <p class="tagline" id="tagline">&nbsp;</p>
      <div class="cta">
        <a class="btn primary" href="projects/">Explore projects →</a>
        <a class="btn" href="blog/">Read the blog</a>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><div><span class="kicker">mission status</span><h2>Road to the Higgs</h2></div><a href="projects/project.html?slug=higgs-diary">Details →</a></div>
      <div class="panel" id="progress"><div class="muted">Loading telemetry…</div></div>
    </section>

    <section class="section">
      <div class="section-head"><div><span class="kicker">featured</span><h2>Projects</h2></div><a href="projects/">All projects →</a></div>
      <div class="cards" id="projects"></div>
    </section>

    <section class="section">
      <div class="section-head"><div><span class="kicker">logbook</span><h2>Latest posts</h2></div><a href="blog/">All posts →</a></div>
      <div class="post-list" id="posts"></div>
    </section>

    <section class="section">
      <div class="section-head"><div><span class="kicker">about</span><h2>Who's writing</h2></div></div>
      <div class="panel prose" id="about"></div>
    </section>
  </main>

  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/vendor/katex.min.js"></script>
  <script src="assets/vendor/auto-render.min.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/listing.js"></script>
  <script>
    (async () => {
      const [site, projects, posts, progress] = await Promise.all([
        FC.json("content/site.json", {}), FC.json("content/projects.json", []),
        FC.json("content/posts.json", []), FC.json("data/progress.json", {})
      ]);
      const guitar = await FC.json("data/guitar-progress.json", {});
      document.getElementById("tagline").textContent = site.tagline || "";
      FC.renderMarkdown(document.getElementById("about"), site.about || "");
      document.getElementById("progress").innerHTML = FC.progressWidget(progress);
      const feat = projects.filter((p) => p.featured);
      document.getElementById("projects").innerHTML = (feat.length ? feat : projects).slice(0, 3).map((p) => Listing.projectCard(p, progress, guitar)).join("") || `<div class="empty">No projects yet.</div>`;
      document.getElementById("posts").innerHTML = Listing.visiblePosts(posts).slice(0, 3).map(Listing.postItem).join("") || `<div class="empty">No posts yet.</div>`;
    })();
  </script>
</body>
</html>
