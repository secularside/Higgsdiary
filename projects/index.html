<!DOCTYPE html>
<html lang="en" data-root="../" data-page="projects">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · freechains</title>
  <meta name="theme-color" content="#05060d">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>
  <main class="page">
    <h1 class="page-title">Projects</h1>
    <p class="page-sub">Things I'm building on the way to 125 GeV.</p>
    <div class="filters" id="filters"></div>
    <div class="cards" id="list"><div class="muted">Loading…</div></div>
  </main>
  <script src="../assets/js/site.js"></script>
  <script src="../assets/js/listing.js"></script>
  <script>
    (async () => {
      const [projects, progress] = await Promise.all([FC.json("content/projects.json", []), FC.json("data/progress.json", {})]);
      const order = { active: 0, planned: 1, paused: 2, idea: 3, completed: 4 };
      let filter = "all";
      const statuses = ["all", ...new Set(projects.map((p) => p.status))];
      function draw() {
        document.getElementById("filters").innerHTML = statuses.map((s) => `<button class="tag ${filter === s ? "on" : ""}" data-s="${FC.esc(s)}">${s === "all" ? "all" : FC.esc(FC.statusLabel[s] || s)}</button>`).join("");
        const list = projects.filter((p) => filter === "all" || p.status === filter).sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9));
        document.getElementById("list").innerHTML = list.map((p) => Listing.projectCard(p, progress)).join("") || `<div class="empty">Nothing here yet.</div>`;
      }
      document.getElementById("filters").addEventListener("click", (e) => { const b = e.target.closest("[data-s]"); if (b) { filter = b.dataset.s; draw(); } });
      draw();
    })();
  </script>
</body>
</html>
